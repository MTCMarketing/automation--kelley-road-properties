# Keeps the website's content.json in step with the CMS.
#
# This repository is PUBLIC, deliberately: Actions minutes are free on public
# repositories, and the website repository is private with a 2,000 minute
# monthly allowance that a rebuild-per-save would exhaust in under a week.
#
# Nothing secret lives in this file. It references secrets by name; it never
# prints them, and the content it moves is the website's own public listings.
#
# ── the shape of it ──────────────────────────────────────────────────────
#   Supabase changes
#     -> a database trigger calls this workflow (repository_dispatch)
#     -> this reads the CMS documents and writes content.json
#     -> commits it to the website repository, which publishes on push
#
# The website builds from that committed content.json rather than calling
# Supabase itself. That is the point of the whole arrangement: when Supabase
# is replaced, only this repository changes, and the website never knows.

name: process

on:
  # What the database trigger calls.
  repository_dispatch:
    types: [content-changed]

  # And a button, for when somebody wants to force a sync.
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even if the content has not changed"
        type: boolean
        default: false

# One run at a time. A second change arriving mid-run cancels the first,
# because the first is about to publish content that is already stale.
concurrency:
  group: content
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      # ── the debounce ──────────────────────────────────────
      # Editing a property through five wizard steps is five saves and would
      # otherwise be five rebuilds. The website repository is private, so each
      # of those costs minutes from a fixed monthly allowance.
      #
      # The newest change always wins: this waits, then reads the CMS once at
      # the end. Anything saved during the wait is included rather than queued
      # behind another run.
      - name: Settle
        if: github.event_name == 'repository_dispatch'
        run: sleep ${{ vars.DEBOUNCE_SECONDS || 120 }}

      - name: Build content.json from the CMS
        id: build
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          # Needed to READ the website's current content.json and decide
          # whether anything actually changed. Without it that read fails, the
          # step assumes "changed", and every dispatch costs a full rebuild -
          # which is the thing this workflow exists to avoid.
          AUTOMATION_CONTENT_JSON: ${{ secrets.AUTOMATION_CONTENT_JSON }}
        run: bash scripts/build-content.sh

      - name: Publish it to the website
        if: steps.build.outputs.changed == 'true' || inputs.force
        env:
          # Scoped to the website repository. Never echoed, and this repository
          # being public does not expose it: secrets are not readable here.
          GITHUB_TOKEN: ${{ secrets.AUTOMATION_CONTENT_JSON }}
          TARGET_REPO: MTCMarketing/source--kelley-roads-property-management
        run: bash scripts/publish-content.sh

      - name: Say what happened
        run: |
          if [ "${{ steps.build.outputs.changed }}" = "true" ]; then
            echo "Published version ${{ steps.build.outputs.version }}."
          else
            echo "The CMS has not changed since the website was last built. Nothing published."
          fi
