# Reads the CMS and writes content.json into .github/content/.
#
# This is the adapter, and it is the ONLY thing in the chain that knows
# Supabase exists. The database calls it; it writes a file; the push starts
# content.yml, which forwards that file to the website.
#
# Replacing Supabase later is a change to this one workflow. Nothing
# downstream — not content.yml, not the website, not the build — knows or
# needs to.
#
# ── why this is separate from content.yml ────────────────────────────────
# Because the file in .github/content/ is worth having as a record. It is
# what was published, visible and diffable, and it can be edited by hand or
# replayed without a database anywhere in the loop. Folding the fetch into
# the publish would make the content a thing that passed through a runner and
# vanished.

name: sync

on:
  # What the database trigger calls.
  repository_dispatch:
    types: [cms-changed]

  # And a button, for a manual re-read.
  workflow_dispatch:

# A newer change makes an in-flight read pointless: it is about to write
# content that is already out of date. Editing a property through five wizard
# steps is five calls and one write.
concurrency:
  group: sync
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Let the saves settle. A wizard step is a save, and reading after the
      # last one is both cheaper and more correct than reading after each.
      - name: Settle
        if: github.event_name == 'repository_dispatch'
        run: sleep ${{ vars.SETTLE_SECONDS || 90 }}

      # The defaults are committed on purpose, and these two values are not
      # secrets. The key is Supabase's PUBLISHABLE key: it is designed to sit
      # in a browser, it is already served inside the website's own JavaScript,
      # and row-level security decides what it may read. Proof rather than
      # assertion: the leads table holds real submissions and this key reads
      # back an empty list from it. It can see the property catalogue, which
      # is the public website, and nothing personal.
      #
      # They are defaults rather than hardcoded so a different database can be
      # pointed at by setting the variables, with no edit to this file. The
      # first run of this workflow failed for exactly the opposite reason:
      # required variables that nobody had set, and a pipeline that could not
      # work until they were. A pipeline that needs a setup step somebody
      # forgot is a pipeline that is off.
      - name: Read the CMS
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://ckfedtlwvbspubbauqvn.supabase.co' }}
          SUPABASE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_2Lh8X-fWvlJQFvpYSLB6Nw_1jKf3DSt' }}
        run: bash scripts/read-cms.sh

      - name: Store it, retrying if another sync got there first
        run: |
          git config user.name "Kelley Road automation"
          git config user.email "automation@kelleyroadproperties.com"

          # Keep our copy somewhere git will not touch, because recovering
          # from a lost race means resetting the working tree.
          mine="$RUNNER_TEMP/content.json"
          cp .github/content/content.json "$mine"

          version() {
            node -e 'try{process.stdout.write(String(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).version||""))}catch{process.stdout.write("")}' "$1"
          }

          ours=$(version "$mine")

          # What is COMMITTED, not what is in the working tree - the working
          # tree already holds the file this run just generated, so reading it
          # here would compare our version against itself, conclude it was
          # already stored, and quietly never commit anything.
          stored() {
            if git show HEAD:.github/content/content.json > "$RUNNER_TEMP/stored.json" 2>/dev/null; then
              version "$RUNNER_TEMP/stored.json"
            fi
          }

          for attempt in 1 2 3; do
            theirs=$(stored)

            # Newest wins, and the version is the database's own updated_at,
            # so "newest" is a fact rather than a guess. Equal means another
            # run stored this exact content already.
            if [ -n "$theirs" ] && ! node -e 'process.exit(process.argv[1] > process.argv[2] ? 0 : 1)' "$ours" "$theirs"; then
              echo "Version $theirs is already stored, which is not older than ours. Nothing written."
              exit 0
            fi

            cp "$mine" .github/content/content.json
            git add -- .github/content/content.json
            git commit -q -m "Content from the CMS, version ${ours}"

            if git push -q origin HEAD:main 2>/dev/null; then
              echo "Stored version ${ours}."
              exit 0
            fi

            # Another sync pushed between our checkout and our push. Not an
            # error: the CMS fires one trigger per save, so a burst of saves
            # is a burst of runs, and two of them overlapping is ordinary.
            # Four runs failed this way on 21 October, each one reporting a
            # red cross for a situation that only needed a second attempt.
            echo "Another sync pushed first; catching up and retrying (attempt ${attempt})."
            git fetch -q origin main
            git reset -q --hard origin/main
          done

          echo "Could not store the content after three attempts." >&2
          exit 1

  # Publishing is content.yml, called rather than left to be noticed.
  #
  # The commit above is made with the built-in token, and GitHub does not
  # start workflows from those pushes - a deliberate guard against a workflow
  # that commits triggering itself forever. So content.yml's push trigger
  # never sees this file arrive and has to be called directly.
  #
  # This runs whether or not THIS run was the one that stored the content,
  # and that is deliberate. It used to be skipped unless this run committed,
  # which left a hole: a run can push the file and then be cancelled by a
  # newer one before it publishes, and every later run would see the file
  # already stored, skip, and leave that content sitting in this repository
  # having never reached the website. Publishing unconditionally closes it -
  # whichever run gets there carries whatever is current.
  #
  # It is cheap to run for nothing: it compares versions with the website
  # first and stops before spending a build when they match.
  publish:
    needs: sync
    uses: ./.github/workflows/content.yml
    secrets: inherit
