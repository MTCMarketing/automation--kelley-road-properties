# Reads the CMS and writes content.json into .github/content/.
#
# This is the adapter, and it is the ONLY thing in the chain that knows
# Supabase exists. The database calls it; it writes a file; the push starts
# content.yml, which forwards that file to the website.
#
# Replacing Supabase later is a change to this one workflow. Nothing
# downstream — not content.yml, not the website, not the build — knows or
# needs to.
#
# ── why this is separate from content.yml ────────────────────────────────
# Because the file in .github/content/ is worth having as a record. It is
# what was published, visible and diffable, and it can be edited by hand or
# replayed without a database anywhere in the loop. Folding the fetch into
# the publish would make the content a thing that passed through a runner and
# vanished.

name: sync

on:
  # What the database trigger calls.
  repository_dispatch:
    types: [cms-changed]

  # And a button, for a manual re-read.
  workflow_dispatch:

# A newer change makes an in-flight read pointless: it is about to write
# content that is already out of date. Editing a property through five wizard
# steps is five calls and one write.
concurrency:
  group: sync
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Let the saves settle. A wizard step is a save, and reading after the
      # last one is both cheaper and more correct than reading after each.
      - name: Settle
        if: github.event_name == 'repository_dispatch'
        run: sleep ${{ vars.SETTLE_SECONDS || 90 }}

      # The defaults are committed on purpose, and these two values are not
      # secrets. The key is Supabase's PUBLISHABLE key: it is designed to sit
      # in a browser, it is already served inside the website's own JavaScript,
      # and row-level security decides what it may read. Proof rather than
      # assertion: the leads table holds real submissions and this key reads
      # back an empty list from it. It can see the property catalogue, which
      # is the public website, and nothing personal.
      #
      # They are defaults rather than hardcoded so a different database can be
      # pointed at by setting the variables, with no edit to this file. The
      # first run of this workflow failed for exactly the opposite reason:
      # required variables that nobody had set, and a pipeline that could not
      # work until they were. A pipeline that needs a setup step somebody
      # forgot is a pipeline that is off.
      - name: Read the CMS
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://ckfedtlwvbspubbauqvn.supabase.co' }}
          SUPABASE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_2Lh8X-fWvlJQFvpYSLB6Nw_1jKf3DSt' }}
        run: bash scripts/read-cms.sh

      - name: Commit it, if it changed
        id: commit
        run: |
          if git diff --quiet -- .github/content/content.json; then
            echo "The CMS has not changed since the last sync. Nothing written."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(".github/content/content.json","utf8")).version)')

          git config user.name "Kelley Road automation"
          git config user.email "automation@kelleyroadproperties.com"
          git add .github/content/content.json
          git commit -m "Content from the CMS, version ${version}"
          git push

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Written and committed. Publishing next."

    outputs:
      changed: ${{ steps.commit.outputs.changed }}

  # Publishing is content.yml, called rather than left to be noticed.
  #
  # The commit above is made with the built-in token, and GitHub does not
  # start workflows from those pushes - a deliberate guard against a workflow
  # that commits triggering itself forever. So content.yml's push trigger
  # never sees this file arrive and has to be called directly.
  #
  # Skipped entirely when nothing changed, so a trigger that turns out to be
  # about nothing costs one short job instead of a five-minute build.
  publish:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/content.yml
    secrets: inherit
