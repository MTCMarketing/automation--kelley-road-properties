# Forwards content written into .github/content/ to the website.
#
# The trigger is the path filter below, and that distinction matters: the
# workflow does not start at all unless something under .github/content/
# changed. It is not a job that runs and then decides it had nothing to do —
# that would still queue a runner and still show a run in the list, for every
# unrelated commit to this repository.
#
# ── how content gets here ────────────────────────────────────────────────
# A change in the CMS fires a database trigger, which asks this repository to
# run sync.yml. That reads the CMS, writes content.json here, and calls this
# workflow. A person editing the file by hand instead takes the push trigger
# above. Either way the file arrives and this publishes it.
#
# Which is the whole point of the arrangement: the database says only that
# something changed. It does not know the website exists, what builds it, or
# where it is deployed. Replacing Supabase later is a change to sync.yml and
# to nothing else.
#
# Why workflow_call as well as push:
#
# Because a push made by a workflow using the built-in token does NOT start
# another workflow. GitHub blocks that deliberately, to stop a workflow that
# commits from triggering itself forever. So sync.yml's commit lands in
# .github/content/ and the push trigger above never sees it. Verified, not
# assumed: commit a310a2b pushed cleanly and no run started.
#
# The path filter stays exactly as it is, because it is still what a human
# edit uses. sync.yml calls this directly instead of relying on its push
# being noticed. Only one of the two routes fires per change, so this
# publishes once, not twice.

name: content

on:
  push:
    paths:
      - ".github/content/**"

  # How sync.yml hands over, for the reason in the preamble.
  workflow_call:

  # A manual run, for republishing after a change to the pipeline itself.
  workflow_dispatch:

# A newer change makes an in-flight run obsolete, so it is cancelled rather
# than left to publish content that is already stale. This is also the
# debounce: editing a property through five wizard steps is five commits
# here, and only the last survives to become a build.
concurrency:
  group: content
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Check the content is there and is readable
        id: check
        run: bash scripts/check-content.sh

      - name: Publish it to the website
        if: steps.check.outputs.ok == 'true'
        env:
          # A deploy key for the website repository, used over SSH. Write
          # access to that one repository and nothing else. This repository is
          # public; its secrets are not, and are not exposed to pull requests
          # from forks.
          DEPLOY_KEY: ${{ secrets.AUTOMATION_CONTENT_JSON }}
          TARGET_REPO: MTCMarketing/source--kelley-roads-property-management
        run: bash scripts/publish-content.sh
